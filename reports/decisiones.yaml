# Decisiones del proyecto y su porqué. Fuente única para reports/resultados.md
# y el informe. Los números salen de reports/tables/.
# quien: "Lucía" = decisión de negocio/criterio; "método" = decisión técnica tomada al construir.

decisiones:
  - id: periodo
    fase: datos
    titulo: "Período: mayo 2025 a noviembre 2026, los dos segmentos"
    decision: "Pedidos con fecha de entrega del 06/05/2025 al 14/11/2026 (472 días hábiles), particulares y empresas. El 18/11/2026 llegaron los exports de individuales y de empresas de septiembre, octubre y noviembre 2026 (mismas 23 columnas, 0 duplicados exactos, 0 entregas en domingo). Empresas sep–nov sale del export de Excel (Resumen comercial → Empresas → Exportar Excel): la pantalla de Resumen comercial muestra 0 en la pestaña Empresas para esos meses, pero el export trae las ventas. El lunes 02/11/2026 es bajo porque es feriado laborable, no un error. `serie.fin_segmento` queda en el código (y sus tests) por si vuelve a faltar un mes, pero hoy no se usa."
    porque: "Son todos los exports disponibles. Se usa el export y no la pantalla porque el export tiene el detalle por línea y coincide en estructura con los meses anteriores; la pantalla en 0 se anota como problema del sistema."
    quien: Lucía

  - id: corte_noviembre
    fase: datos
    titulo: "Noviembre se corta en la última semana completa (14/11/2026)"
    decision: "Los exports de noviembre (bajados el 18/11) traen líneas con entrega posterior al 14/11/2026 (pedidos ya cargados para días futuros y la semana en curso): 2.225 en individuales y 4.351 en empresas. Se descartan en load.py y se cuentan en calidad_datos (posteriores_al_corte)."
    porque: "Una semana incompleta subestima la demanda y rompería el backtest semanal (lunes a sábado). `Fecha de pedido` sigue sin servir: es igual a la fecha de entrega en el 100 % de septiembre y octubre y en todas menos 3 líneas de noviembre."
    quien: método

  - id: platos_nuevos
    fase: datos
    titulo: "Tres platos nuevos en categorias.yaml"
    decision: "Penne rigatte con salsa → pastas (forma); Solomillo relleno con guarnicion → cerdo [SUPUESTO: el solomillo de la carta es de cerdo, como 'Solomillo de cerdo']. Entre los dos suman 5 viandas de particulares en sep–nov 2026. Hamburguesa al pan (empresas, sep–nov 2026) → carne vacuna [SUPUESTO: como las Hamburguesas Caseras]; sin receta en el recetario (SIN_RECETA en recetas_map.yaml)."
    porque: "asignar_categoria falla si hay platos sin categoría (para no perder unidades en silencio). Pendiente de validar por Lucía."
    quien: Lucía

  - id: fecha_entrega
    fase: datos
    titulo: "La serie se indexa por fecha de entrega"
    decision: "Se usa `Fecha de entrega`, no `Fecha de pedido`."
    porque: "La cocina y las compras se planifican para el día en que se entrega. El export no trae la hora de creación de los pedidos, así que el nowcasting con pedidos ya confirmados queda afuera."
    quien: Lucía

  - id: dias_habiles
    fase: datos
    titulo: "Los días cerrados no existen"
    decision: "La serie va de lunes a sábado sin feriados no laborables; domingos y feriados no laborables no son ceros, se sacan. Se abre en los feriados laborables (Carnaval, Turismo…)."
    porque: "Un cero en un día cerrado no es demanda nula: meterlo sesgaría la media y la estacionalidad. Se verificó en los datos que en los feriados laborables hay entregas."
    quien: Lucía

  - id: domingos
    fase: datos
    titulo: "Se descartan las 7 líneas con entrega en domingo"
    decision: "Las líneas en domingo (5 domingos) se eliminan y se reportan en calidad_datos."
    porque: "El negocio no entrega los domingos: son errores de carga y no alcanzan para modelar un séptimo día."
    quien: Lucía

  - id: duplicados
    fase: datos
    titulo: "Se eliminan los duplicados exactos"
    decision: "Las filas idénticas (todas en 2026.08 particulares, entregas del 20 y 21/08/2026) se eliminan y se cuentan por archivo."
    porque: "Son repeticiones del export, no pedidos nuevos."
    quien: método

  - id: lunes_17_08
    fase: datos
    titulo: "El lunes 17/08/2026 se deja como está"
    decision: "Particulares ese día tiene los pedidos correctos pero casi sin líneas (mediana 1 vianda por pedido contra ~7). Se deja y se declara como limitación."
    porque: "No hay forma de reconstruir las líneas faltantes sin inventar datos. Era el peor error del backtest 08/06–29/08/2026 en todos los modelos y sacarlo no cambiaba el ranking. Desde el 18/11/2026 queda fuera de las semanas pronosticadas (24/08–14/11/2026): sigue en el entrenamiento y entre los errores previos que arman el intervalo 80 % de los primeros orígenes."
    quien: Lucía

  - id: anonimizacion
    fase: datos
    titulo: "Datos públicos anonimizados y escalados por K"
    decision: "Al repo solo suben agregados por categoría: cantidades × K secreta, importes y gasto de Meta como índice base 100. Nunca por plato."
    porque: "El repo es público. Con celdas por plato muy chicas se podría estimar K. MASE, WAPE, coberturas, participaciones y elasticidades no cambian con K, así que las conclusiones son las mismas."
    quien: Lucía

  - id: verano
    fase: eda
    titulo: "Enero es verano (estacionalidad), no un quiebre"
    decision: "La caída de enero se modela con la variable `verano`. Efecto medido en el Total: −25 % [−29; −21] (regresión de efectos de calendario, eda_efectos_calendario.csv, días hábiles 06/05/2025–14/11/2026)."
    porque: "Es la temporada de vacaciones en Montevideo: clientes de oficina y particulares se van. Tratarla como quiebre haría creer que la serie cambió de nivel para siempre."
    quien: Lucía

  - id: segmentos
    fase: modelos
    titulo: "Particulares y empresas por separado"
    decision: "Se pronostica cada segmento y el total es la suma."
    porque: "Tienen perfiles semanales opuestos: el sábado los particulares están en 0,87 de su media y las empresas en 0,25; el lunes, 1,60 contra 1,07 (eda_dia_semana.csv, días hábiles 06/05/2025–14/11/2026). Un modelo único los mezclaría."
    quien: Lucía

  - id: horizonte
    fase: modelos
    titulo: "Horizonte: la semana siguiente, con datos hasta el sábado"
    decision: "Cada sábado se pronostican los 6 días hábiles de lunes a sábado siguientes."
    porque: "Es como se planifica en el negocio: el fin de semana se decide qué comprar y cocinar para la semana."
    quien: Lucía

  - id: walk_forward
    fase: modelos
    titulo: "Backtest walk-forward de 12 semanas"
    decision: "Un solo backtest, del Total: 12 orígenes (sábados 22/08–07/11/2026), ventana expansiva; semanas pronosticadas 24/08–14/11/2026 (`pronostico.fin_test`). Métricas solo en días abiertos. Hasta el 18/11/2026 el Total terminaba en agosto (08/06–29/08/2026) y había un backtest aparte de particulares; con empresas hasta noviembre ya no hace falta."
    porque: "Simula exactamente el uso real: cada semana se reentrena con todo lo disponible y nunca se mira el futuro (hay tests de leakage)."
    quien: método

  - id: metricas
    fase: modelos
    titulo: "MASE, WAPE y cobertura del intervalo 80 %; nada de MAPE"
    decision: "Se comparan modelos con MAE, MASE (relativo al naive estacional), WAPE y la cobertura del intervalo 80 %. Diebold-Mariano entre los mejores y Ljung-Box sobre los residuos de ETS y SARIMA."
    porque: "MAPE explota con días chicos y castiga asimétricamente. MASE, WAPE y la cobertura además no cambian con el escalado K."
    quien: método

  - id: modelos_total
    fase: modelos
    titulo: "Siete modelos, de lo más simple a lo más complejo"
    decision: "naive, naive estacional, media móvil 4 semanas, ETS (Holt-Winters de statsmodels), SARIMA (statsmodels), LightGBM directo y un MLP en PyTorch. LightGBM y el MLP usan las mismas variables: 18 rezagos y 2 medias móviles divididos por el nivel de la última semana, día de la semana, feriados, Turismo, verano y h (estrategia directa)."
    porque: "Son los modelos de series temporales clásicos y los de ML que se vieron en el curso (boosting y redes MLP), así que todo se puede explicar. ETS elige por AIC entre estacionalidad aditiva o multiplicativa y sin tendencia o con tendencia amortiguada. El MLP escala con media y desvío de su tramo de entrenamiento y frena con early stopping sobre las últimas 4 semanas de cada origen; semilla 42."
    quien: método

  - id: sarima_ordenes
    fase: modelos
    titulo: "Órdenes del SARIMA elegidos por AIC en cada origen"
    decision: "SARIMA (p,0,q)(P,1,Q)[6] con constante sobre log(y), sin exógenas. En cada origen se ajustan las 36 combinaciones p, q ∈ {0,1,2} y P, Q ∈ {0,1} solo con los datos hasta ese sábado, y se queda la de menor AIC. Al último origen quedó (2,0,2)(1,1,1)[6] (backtest_total, python main.py backtest)."
    porque: "El log estabiliza la varianza, que crece con el nivel. D = 1 porque con una diferencia estacional de 6 días la serie es estacionaria (ADF del EDA) y d = 0 para no diferenciar de más; la constante es el crecimiento medio semana a semana. El AIC premia el ajuste y castiga los parámetros de más, y elegir en cada origen con su propio entrenamiento evita mirar el test."
    quien: método

  - id: intervalo_80
    fase: modelos
    titulo: "Intervalo 80 % con los errores recientes de cada modelo"
    decision: "Para cada origen y modelo: intervalo = ŷ × [percentil 10; percentil 90] del cociente real/pronóstico (y/ŷ) de ese mismo modelo en los 12 orígenes semanales previos. Para tener esos errores en el primer origen de test, el backtest corre además los 12 sábados anteriores (30/05–15/08/2026), que no entran en las métricas."
    porque: "Es el mismo método para todos los modelos, no supone ninguna distribución y solo usa semanas que ya terminaron al momento del origen (la semana pronosticada desde o − 1 termina justo en o), así que no mira el test. Se usa el cociente y no la diferencia porque la serie crece y el error escala con el nivel. 12 semanas: suficientes errores (~70 días) y lo bastante recientes."
    quien: método

  - id: modelo_total
    fase: modelos
    titulo: "LightGBM directo como modelo del total (y de los segmentos)"
    decision: "lgbm_directo (MASE 0,846) queda primero, seguido de sarima (0,911) y ets (0,915) (backtest 24/08–14/11/2026). Antes (Total hasta agosto, backtest 08/06–29/08/2026): lgbm 1,116, media móvil 1,150, ETS 1,221. Se mantiene LightGBM."
    porque: "Sigue siendo el de menor error en la ventana nueva, aunque Diebold-Mariano no lo separa de SARIMA (p = 0,46) ni de ETS (p = 0,45) al 5 %. Los cuatro mejores le ganan al naive estacional (p ≤ 0,018). El MLP (1,036) no le gana a LightGBM y se reporta así. Cambió el orden de los que siguen (la media móvil pasa del 2.º al 4.º lugar), no el primero."
    quien: método

  - id: clima_total
    fase: modelos
    titulo: "El clima no entra al pronóstico del total"
    decision: "LightGBM sin clima. En el backtest anterior a la simplificación, lgbm_directo con clima tuvo MASE 1,203 contra 1,106 sin clima."
    porque: "El clima no mueve cuántas viandas se piden, sino cuáles. Además es dato observado: en producción habría que usar el pronóstico del tiempo, que agrega error."
    quien: método

  - id: clima_mix
    fase: mix
    titulo: "El clima va como hallazgo descriptivo, no como mejora del pronóstico"
    decision: "En el informe se muestra el efecto de la temperatura en el mix, pero para pronosticar se usa la participación media de las últimas 4 semanas."
    porque: "Con calor (24,6 °C) contra frío (11,3 °C) la carne vacuna cae 7,2 pp en empresas y 2,5 pp en particulares (IC 95 % sin cero; mix_efecto_temperatura.csv, 06/05/2025–14/11/2026). Para pronosticar, el clima no agrega: en empresas media_4sem tiene la menor log loss (1,6792 contra 1,6817 del multinomial con clima); en particulares el multinomial con clima queda apenas primero (1,7485 contra 1,7502 de media_4sem, −0,1 %), pero sin clima da lo mismo (1,7486): la mejora es del multinomial, no de la temperatura (backtest 24/08–14/11/2026). El mix reciente ya trae la estación."
    quien: Lucía

  - id: modelo_categorias
    fase: mix
    titulo: "Categorías = segmento (LightGBM) × participación media de 4 semanas"
    decision: "El pronóstico por segmento × categoría es lgbm_directo del segmento multiplicado por la participación media_4sem."
    porque: "MASE 0,901 en categorías contra 0,907 del multinomial y 0,905 del multinomial con clima (backtest 24/08–14/11/2026), y el intervalo 80 % cubre 78,5 %. Es coherente por construcción (las categorías suman el segmento) y aprovecha el mejor modelo del total."
    quien: Lucía

  - id: contrafactual_sarima
    fase: eventos
    titulo: "Contrafactual con SARIMA sin constante + placebos"
    decision: "Para cada evento se ajusta un SARIMA sobre log(y) solo con los días previos (órdenes por AIC en la misma grilla chica del total) con exógenas de calendario y sin constante; su pronóstico del período posterior es el contrafactual. Se repite en fechas falsas anteriores (placebos)."
    porque: "Con D = 1 la constante es una deriva semanal que, proyectada 4–8 semanas, inventa efectos: con constante, los placebos de la agencia daban −20 y −15 % significativos. Si los placebos también encuentran efecto, el método no es confiable para ese evento."
    quien: método

  - id: agencia_cota
    fase: eventos
    titulo: "El efecto de la agencia de Meta es una cota superior"
    decision: "El +80 % [+18; +171] en viandas de particulares tras el 02/02/2026 (eventos_efectos.csv) se presenta como cota superior."
    porque: "Está confundido con la vuelta del verano: no hay febrero–marzo previos para aprender ese rebote, y los placebos de influencer con fecha en feb–abr 2026 dan entre +4 y +25 % (ninguno significativo)."
    quien: Lucía

  - id: suba_precio_preliminar
    fase: eventos
    titulo: "La suba de precio sigue siendo preliminar"
    decision: "Con datos hasta noviembre se mide con 8 semanas posteriores (01/08–25/09/2026): viandas de particulares +12 % [−23; +64], 0 de 4 placebos significativos, p-placebo 0,2. Sensibilidad con 13 semanas (hasta el 30/10): +11 % [−27; +63], con 1 solo placebo."
    porque: "La regla era sacarle la etiqueta solo si los placebos lo permiten. Con ventanas de 8 semanas o más entran como mucho 4 placebos (las ventanas no pueden cruzar otros eventos ni un enero sin enero previo), así que el p-placebo no puede bajar de 1/5 = 0,2. Además, la ventana se superpone con el cambio de reparto de Meta del 05/09."
    quien: método

  - id: efecto_minimo
    fase: eventos
    titulo: "Efecto mínimo detectable con los placebos"
    decision: "Para cada evento: EMD = 2,8 × desvío de los efectos placebo (test bilateral al 5 % con potencia 80 %)."
    porque: "Con pocas semanas posteriores un efecto no significativo no quiere decir 'sin efecto': el EMD dice qué tamaño se podría haber visto con ese ruido."
    quien: método

  - id: eventos_meta_nuevos
    fase: eventos
    titulo: "Cambio de reparto (05/09) y baja de pauta (02/11): sin efecto detectable"
    decision: "Sobre clientes nuevos de particulares por día (en nivel: hay días con 0). Reparto entre anuncios del 05/09/2026, 8 semanas: −7 % [−50; +265], 0 de 3 placebos. Baja de pauta desde el 02/11/2026 [SUPUESTO: primera semana con menos gasto en el Tablero], 2 semanas: clientes nuevos −8 % [−51; +278] (EMD ±45 %), pedidos de clientes que ya compraron −2 % [−13; +14] (EMD ±19 %). PRELIMINAR."
    porque: "La baja es chica hasta ahora (campaña ~9.100 → 8.400 UYU en la semana del 02/11, −8 %) y hay solo 12 días hábiles posteriores. Que ni nuevos ni recurrentes se muevan es coherente con una baja que todavía no se nota; hay que volver a medir cuando haya más semanas y el gasto diario."
    quien: método

  - id: meta_no_identificado
    fase: ads
    titulo: "El efecto del gasto en Meta no está identificado"
    decision: "En el informe: efecto no identificado y recomendación de variar el gasto a propósito para poder medirlo. Métodos: regresiones lineales log-log y tests de Granger con 1 rezago. Meta reemplazado el 18/11/2026: 44 semanas (05/01–08/11/2026)."
    porque: "Desde febrero el gasto casi no varía (CV 2,8 % hasta el 08/11/2026); la información está en el escalón ene→feb, confundido con el verano. Regresión log(clientes nuevos) ~ log(gasto total) + verano (44 semanas): elasticidad +0,04 [−1,06; +1,15], p = 0,94 (antes, con 34 semanas, −1,11, p = 0,32: el signo cambió y sigue sin ser significativo), correlación −0,996 entre log gasto y verano. Con el gasto de la campaña desde febrero (40 semanas): −1,29 [−3,91; +1,33], p = 0,33. Granger gasto de la campaña → clientes nuevos: p = 0,303."
    quien: Lucía

  - id: clics_meta
    fase: ads
    titulo: "Los clics se mueven con los clientes nuevos, pero es correlación"
    decision: "Regresión log(clientes nuevos) ~ log(clics de la campaña) desde el 02/02/2026 (40 semanas; verano constante, sale): elasticidad +0,27 [+0,04; +0,49], p = 0,020, R² = 0,05. Granger clics → clientes nuevos con 1 rezago (fijado antes de mirar): p = 0,034."
    porque: "Los clics varían (CV 26 %) porque la agencia cambia anuncios; el gasto no. Pero los clics no se asignan al azar: el anuncio que la agencia elige puede ir con la estación o con la oferta. Es una señal, no un efecto causal; la recomendación de variar el gasto a propósito se mantiene. Sin UTM en el export, la atribución por anuncio queda como trabajo futuro."
    quien: método

  - id: plan_colchon
    fase: plan
    titulo: "Plan = pronóstico + colchón"
    decision: "Plan semanal = pronóstico semanal × percentil p del cociente real/pronóstico (y/ŷ) de las 12 semanas previas al origen. Se prueban p = 40, 45, …, 95 y se elige el de menor costo simulado en el backtest; 80/90/95 se muestran como referencia."
    porque: "Es la idea más simple que corrige el pronóstico con sus propios errores recientes, sin suponer una distribución y sin mirar el test (solo semanas ya terminadas). Elegir p en el mismo backtest es algo optimista; se declara."
    quien: método

  - id: compra_semanal
    fase: plan
    titulo: "Una compra semanal por segmento × categoría"
    decision: "El plan es una compra para los 6 días de la semana siguiente, por segmento y categoría."
    porque: "Es como se compra en el negocio: el fin de semana para toda la semana."
    quien: Lucía

  - id: semanal_agrupado
    fase: plan
    titulo: "El colchón junta las 7 categorías del segmento"
    decision: "Los errores y/ŷ de las 7 categorías del segmento se juntan para calcular el percentil."
    porque: "Hay un error por serie y semana: con 12 semanas, el percentil 90 y el 95 serían ambos el máximo. Juntando las 7 categorías hay 84 errores."
    quien: método

  - id: costo_faltante
    fase: plan
    titulo: "Faltante = margen perdido, ponderado por XL, con sensibilidad"
    decision: "Desde el 18/11/2026: sobrante $200 normal / $260 XL y faltante $150 / $155 (precio 350 / 415 − costo), ponderados por la proporción de XL del segmento en las 12 semanas previas a cada origen (empresas ~16,5 %, particulares ~5,5 %). Backtest de los dos segmentos 24/08–14/11/2026: p elegido = 50 (antes 45, con empresas en 08/06–29/08), 15,4 UYU por vianda demandada (antes 16,5). p = 45 cuesta 15,5: casi empate. Con costos fijos p también sería 50. Por segmento con p = 50: empresas cobertura 38 %, 15,9 UYU por vianda; particulares 43 %, 15,1. Sensibilidad faltante $150/$300/$600 → p 50/60/75 (antes 45/60/75). El plan de empresas de la semana 16/11–21/11/2026 ya no es [SUPUESTO]: sale de sus datos hasta el 14/11/2026."
    porque: "Como sobrar duele más que faltar, no conviene sumar colchón: lo más barato es comprar cerca del pronóstico (p = 50; antes 45, por debajo). Si quedarse corto hace perder al cliente, el faltante cuesta más y conviene comprar más."
    quien: Lucía

  - id: platos_a_ingredientes
    fase: compras
    titulo: "Del plan a los ingredientes con el recetario, solo multiplicaciones"
    decision: "Plan por segmento × categoría → reparto entre platos (últimas 4 semanas, normal y XL) → gramos por ingrediente según Costo del recetario (93 platos, 46 bases; bases abiertas de forma recursiva por rendimiento real) → ÷ (1 − merma del ingrediente; con merma negativa, la pasta seca que absorbe agua, no se divide) → kg por ingrediente y proveedor. Guarniciones: 250 g por vianda en los platos con acompañamiento (más de la mitad de sus unidades traen una guarnición que es una preparación base), repartidas con la columna Guarniciones de las últimas 4 semanas."
    porque: "No agrega teoría: son las cuentas que hace la cocina. Mapeo plato vendido → receta en config/recetas_map.yaml (86 por nombre normalizado, 4 a mano, 31 sin receta); 26 platos sin receta suman 13,7 % de las viandas de las últimas 12 semanas (22/08–14/11/2026, los dos segmentos; antes 9,5 % con empresas en junio–agosto) y quedan fuera. Los 5 ingredientes sin match en la lista de ingredientes (marcados $0 en la app) y el agua quedan fuera."
    quien: método

  - id: xl_sin_receta
    fase: compras
    titulo: "XL sin receta propia = normal × 1,30"
    decision: "Solo 4 XL tienen receta propia (pastel de carne, pastel de carne con papas y boniatos, strogonoff de vacío y de pollo). Las demás: gramos de la normal × 1,30, también la guarnición. [SUPUESTO] a validar con Lucía."
    porque: "Es el mismo +30 % que se usa para el costo de la XL ($260)."
    quien: método

  - id: compras_privado
    fase: compras
    titulo: "La lista de compras completa no se sube"
    decision: "Recetas, gramos, mermas, proveedores y la lista en kg van a reports_private/ (en .gitignore). Al repo sube solo el % de los kg por familia de ingrediente y un resumen (cantidad de ingredientes y proveedores, % sin receta)."
    porque: "Es información comercial del negocio. El % por familia no depende de K ni permite reconstruir recetas."
    quien: Lucía
